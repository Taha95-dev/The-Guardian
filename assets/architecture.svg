<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .box { fill: #1a1a2e; stroke: #00d4ff; stroke-width: 2; rx: 8; ry: 8; }
      .box-dark { fill: #0d0d1a; stroke: #7b2ffc; stroke-width: 2; rx: 8; ry: 8; }
      .box-light { fill: #16213e; stroke: #00d4ff; stroke-width: 1.5; rx: 6; ry: 6; }
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #00d4ff; text-anchor: middle; }
      .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #8892b0; text-anchor: middle; }
      .text-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #ccd6f6; text-anchor: middle; }
      .arrow { stroke: #7b2ffc; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-down { stroke: #7b2ffc; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b2ffc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0f"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" fill="#00d4ff" letter-spacing="3">
    THE GUARDIAN — ARCHITECTURE
  </text>

  <!-- Layer 1: Core -->
  <rect x="50" y="70" width="700" height="70" class="box"/>
  <text x="400" y="95" class="text-title">CORE LIBRARY</text>
  <text x="180" y="120" class="text-label">Atoms (Immutable)</text>
  <text x="360" y="120" class="text-label">Molecules (Composable)</text>
  <text x="540" y="120" class="text-label">Quarks (0-Overhead)</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="140" x2="400" y2="170" class="arrow-down"/>

  <!-- Layer 2: Memory -->
  <rect x="50" y="175" width="700" height="70" class="box"/>
  <text x="400" y="200" class="text-title">MEMORY SYSTEM</text>
  <text x="180" y="225" class="text-label">Cache Manager</text>
  <text x="360" y="225" class="text-label">LUT (Lookup Table)</text>
  <text x="540" y="225" class="text-label">Memory Manager</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="245" x2="400" y2="275" class="arrow-down"/>

  <!-- Layer 3: Parser -->
  <rect x="50" y="280" width="700" height="70" class="box"/>
  <text x="400" y="305" class="text-title">PARSER FRAMEWORK</text>
  <text x="250" y="330" class="text-label">Lexer Base → Tokens</text>
  <text x="450" y="330" class="text-label">Parser Base → AST</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="350" x2="400" y2="380" class="arrow-down"/>

  <!-- Layer 4: Format -->
  <rect x="50" y="385" width="700" height="70" class="box"/>
  <text x="400" y="410" class="text-title">FORMAT FRAMEWORK</text>
  <text x="250" y="435" class="text-label">.gbin Format</text>
  <text x="450" y="435" class="text-label">Format Registry</text>

  <!-- Arrow 4 -->
  <line x1="400" y1="455" x2="400" y2="485" class="arrow-down"/>

  <!-- Layer 5: VM -->
  <rect x="50" y="490" width="700" height="70" class="box"/>
  <text x="400" y="515" class="text-title">VIRTUAL MACHINE</text>
  <text x="250" y="540" class="text-label">Bytecode Execution</text>
  <text x="450" y="540" class="text-label">Stack Operations</text>

  <!-- Side label -->
  <text x="15" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#7b2ffc" transform="rotate(-90, 15, 315)" letter-spacing="2">
    DEPENDENCY FLOW
  </text>
</svg>

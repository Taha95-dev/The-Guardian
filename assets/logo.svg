<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradient for the shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="2"/>
  
  <!-- Shield outline -->
  <path d="M200 60 L320 110 L320 220 C320 290 260 330 200 350 C140 330 80 290 80 220 L80 110 Z" 
        fill="url(#shieldGrad)" 
        stroke="#2a2a4e" 
        stroke-width="3"
        filter="url(#shadow)"/>
  
  <!-- Shield inner glow -->
  <path d="M200 80 L300 120 L300 220 C300 280 250 315 200 330 C150 315 100 280 100 220 L100 120 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.1)" 
        stroke-width="2"/>
  
  <!-- Eye/Symbol in shield -->
  <circle cx="200" cy="180" r="40" fill="#1a1a2e" stroke="#fff" stroke-width="2" opacity="0.9"/>
  <circle cx="200" cy="180" r="30" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="180" r="15" fill="#fff" opacity="0.9"/>
  <circle cx="200" cy="180" r="8" fill="#1a1a2e"/>
  
  <!-- Left wing -->
  <path d="M100 140 C70 130 50 110 40 80 C50 100 70 110 90 115 C80 100 75 80 80 60 C85 80 95 95 110 105" 
        fill="url(#shieldGrad)" 
        opacity="0.8"/>
  
  <!-- Right wing -->
  <path d="M300 140 C330 130 350 110 360 80 C350 100 330 110 310 115 C320 100 325 80 320 60 C315 80 305 95 290 105" 
        fill="url(#shieldGrad)" 
        opacity="0.8"/>
  
  <!-- Crown -->
  <path d="M160 70 L170 50 L180 65 L190 45 L200 60 L210 45 L220 65 L230 50 L240 70 Z" 
        fill="#f0c040" 
        stroke="#d4a020" 
        stroke-width="1.5"
        filter="url(#glow)"/>
  
  <!-- Guard label -->
  <text x="200" y="260" 
        font-family="'Courier New', monospace" 
        font-size="24" 
        font-weight="bold" 
        fill="#fff" 
        text-anchor="middle" 
        letter-spacing="4">
    GUARDIAN
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="285" 
        font-family="'Arial', sans-serif" 
        font-size="11" 
        fill="#8888aa" 
        text-anchor="middle" 
        letter-spacing="2">
    LANGUAGE FRAMEWORK
  </text>
  
  <!-- Decorative dots -->
  <circle cx="120" cy="310" r="3" fill="#667eea" opacity="0.5"/>
  <circle cx="280" cy="310" r="3" fill="#667eea" opacity="0.5"/>
  
  <!-- Small stars -->
  <circle cx="160" cy="320" r="2" fill="#8888aa" opacity="0.3"/>
  <circle cx="200" cy="325" r="2" fill="#8888aa" opacity="0.3"/>
  <circle cx="240" cy="320" r="2" fill="#8888aa" opacity="0.3"/>
</svg>

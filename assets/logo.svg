<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Shield background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ffc"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M100 10 L190 50 L190 120 C190 160 150 185 100 195 C50 185 10 160 10 120 L10 50 Z"
        fill="url(#shieldGrad)" stroke="#00d4ff" stroke-width="2"/>

  <!-- Guardian symbol (eye with shield) -->
  <circle cx="100" cy="90" r="35" fill="none" stroke="url(#gemGrad)" stroke-width="3"/>
  <circle cx="100" cy="90" r="20" fill="url(#gemGrad)" opacity="0.3"/>
  <circle cx="100" cy="90" r="8" fill="#00d4ff"/>

  <!-- Shield accent lines -->
  <line x1="60" y1="55" x2="60" y2="120" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="140" y1="55" x2="140" y2="120" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottom shield wave -->
  <path d="M70 170 C85 185 115 185 130 170" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Text: THE GUARDIAN -->
  <text x="100" y="230" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#00d4ff" letter-spacing="3">
    THE GUARDIAN
  </text>
  <text x="100" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0" letter-spacing="4">
    LANGUAGE FRAMEWORK
  </text>
</svg>

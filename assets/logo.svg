<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradients -->
    <radialGradient id="atomGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="100%" style="stop-color:#764ba2" />
    </linearGradient>
    
    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="#0a0a0f" stroke="#1a1a2e" stroke-width="2"/>
  
  <!-- Outer atom shell -->
  <circle cx="200" cy="160" r="80" fill="none" stroke="url(#orbitGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="160" r="60" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Orbit 1 (horizontal) -->
  <ellipse cx="200" cy="160" rx="90" ry="30" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" opacity="0.6" transform="rotate(0, 200, 160)"/>
  
  <!-- Orbit 2 (diagonal) -->
  <ellipse cx="200" cy="160" rx="90" ry="30" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" opacity="0.6" transform="rotate(60, 200, 160)"/>
  
  <!-- Orbit 3 (diagonal other way) -->
  <ellipse cx="200" cy="160" rx="90" ry="30" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" opacity="0.6" transform="rotate(-60, 200, 160)"/>
  
  <!-- Electrons -->
  <circle cx="200" cy="70" r="8" fill="#667eea" filter="url(#glow)"/>
  <circle cx="270" cy="200" r="8" fill="#764ba2" filter="url(#glow)"/>
  <circle cx="130" cy="200" r="8" fill="#667eea" filter="url(#glow)"/>
  
  <!-- Electron trails -->
  <circle cx="200" cy="70" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="270" cy="200" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="130" cy="200" r="4" fill="#fff" opacity="0.5"/>
  
  <!-- Nucleus -->
  <circle cx="200" cy="160" r="18" fill="url(#atomGrad)" filter="url(#glow)"/>
  <circle cx="200" cy="160" r="10" fill="#fff" opacity="0.9"/>
  <circle cx="200" cy="160" r="5" fill="#0a0a0f"/>
  
  <!-- Text: GUARDIAN -->
  <text x="200" y="270" 
        font-family="'Arial Black', 'Helvetica', sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="6">
    GUARDIAN
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="300" 
        font-family="'Arial', sans-serif" 
        font-size="12" 
        fill="#666" 
        text-anchor="middle" 
        letter-spacing="4">
    LANGUAGE FRAMEWORK
  </text>
  
  <!-- Tagline -->
  <text x="200" y="330" 
        font-family="'Arial', sans-serif" 
        font-size="10" 
        fill="#444" 
        text-anchor="middle" 
        letter-spacing="2">
    SAFE BY DESIGN · NOT BY CHOICE
  </text>
  
  <!-- Decorative bottom line -->
  <line x1="100" y1="345" x2="300" y2="345" stroke="url(#textGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Built by -->
  <text x="200" y="370" 
        font-family="'Arial', sans-serif" 
        font-size="9" 
        fill="#333" 
        text-anchor="middle" 
        letter-spacing="1">
    BUILT BY A 13-YEAR-OLD ON 4GB RAM
  </text>
</svg>

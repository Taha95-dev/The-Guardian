<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="20" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="2"/>
  
  <!-- Decorative left line -->
  <line x1="20" y1="40" x2="20" y2="160" stroke="url(#bannerGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Decorative right line -->
  <line x1="780" y1="40" x2="780" y2="160" stroke="url(#bannerGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Shield icon (small) -->
  <g transform="translate(40, 60)">
    <path d="M20 0 L35 8 L35 35 C35 50 28 55 20 60 C12 55 5 50 5 35 L5 8 Z" 
          fill="url(#bannerGrad)" 
          stroke="#2a2a4e" 
          stroke-width="1.5"/>
    <circle cx="20" cy="25" r="8" fill="#1a1a2e" stroke="#fff" stroke-width="1"/>
    <circle cx="20" cy="25" r="4" fill="#fff"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="90" 
        font-family="'Arial Black', sans-serif" 
        font-size="48" 
        font-weight="900" 
        fill="url(#textGrad)" 
        letter-spacing="6">
    THE GUARDIAN
  </text>
  
  <!-- Tagline -->
  <text x="100" y="130" 
        font-family="'Arial', sans-serif" 
        font-size="18" 
        fill="#8888aa" 
        letter-spacing="3">
    SAFE BY DESIGN · NOT BY CHOICE
  </text>
  
  <!-- Features -->
  <g transform="translate(500, 60)">
    <rect x="0" y="0" width="260" height="70" rx="10" fill="rgba(255,255,255,0.05)" stroke="#2a2a4e" stroke-width="1"/>
    
    <text x="15" y="22" font-family="'Arial', sans-serif" font-size="11" fill="#667eea" letter-spacing="1">⚡ 7,000+ LINES</text>
    <text x="130" y="22" font-family="'Arial', sans-serif" font-size="11" fill="#764ba2" letter-spacing="1">🧠 0 TODOs</text>
    
    <text x="15" y="45" font-family="'Arial', sans-serif" font-size="11" fill="#8888aa" letter-spacing="1">🛡️ MEMORY SAFE</text>
    <text x="130" y="45" font-family="'Arial', sans-serif" font-size="11" fill="#8888aa" letter-spacing="1">🚀 NO GC</text>
  </g>
  
  <!-- Bottom text -->
  <text x="400" y="180" 
        font-family="'Arial', sans-serif" 
        font-size="12" 
        fill="#444466" 
        text-anchor="middle" 
        letter-spacing="2">
    LANGUAGE FRAMEWORK · VM · CUSTOM BINARY FORMATS
  </text>
  
  <!-- Gradients for status bars -->
  <rect x="200" y="175" width="400" height="2" rx="1" fill="url(#bannerGrad)" opacity="0.3"/>
</svg>

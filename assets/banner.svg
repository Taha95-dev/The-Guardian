<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="#0a0a0f" stroke="#1a1a2e" stroke-width="2"/>
  
  <!-- Glow line top -->
  <line x1="50" y1="30" x2="750" y2="30" stroke="url(#bannerGrad)" stroke-width="1" opacity="0.2"/>
  
  <!-- Small atom icon (left) -->
  <g transform="translate(40, 45)">
    <ellipse cx="20" cy="50" rx="22" ry="9" fill="none" stroke="url(#bannerGrad)" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="20" cy="50" rx="22" ry="9" fill="none" stroke="url(#bannerGrad)" stroke-width="1.5" opacity="0.5" transform="rotate(60, 20, 50)"/>
    <ellipse cx="20" cy="50" rx="22" ry="9" fill="none" stroke="url(#bannerGrad)" stroke-width="1.5" opacity="0.5" transform="rotate(-60, 20, 50)"/>
    <circle cx="20" cy="50" r="7" fill="url(#bannerGrad)"/>
    <circle cx="20" cy="50" r="3.5" fill="#0a0a0f"/>
    <circle cx="20" cy="28" r="3.5" fill="#667eea" opacity="0.8"/>
    <circle cx="42" cy="50" r="3.5" fill="#764ba2" opacity="0.8"/>
    <circle cx="-2" cy="50" r="3.5" fill="#667eea" opacity="0.8"/>
  </g>
  
  <!-- TITLE -->
  <text x="95" y="65" 
        font-family="'Arial Black', 'Helvetica', sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="url(#textGrad)" 
        letter-spacing="4">
    THE GUARDIAN
  </text>
  
  <!-- TAGLINE -->
  <text x="90" y="98" 
        font-family="'Arial', sans-serif" 
        font-size="14" 
        fill="#666" 
        letter-spacing="4">
    SAFE BY DESIGN · NOT BY CHOICE
  </text>
  
  <!-- FEATURES (under the tagline) -->
  <g transform="translate(90, 115)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="11" fill="#667eea" letter-spacing="1">⚡ 7,000+ LINES</text>
    <text x="130" y="0" font-family="'Arial', sans-serif" font-size="11" fill="#764ba2" letter-spacing="1">🧠 0 TODOs</text>
    <text x="260" y="0" font-family="'Arial', sans-serif" font-size="11" fill="#888" letter-spacing="1">🛡️ MEMORY SAFE</text>
    
    <text x="0" y="22" font-family="'Arial', sans-serif" font-size="11" fill="#888" letter-spacing="1">🚀 NO GC</text>
    <text x="130" y="22" font-family="'Arial', sans-serif" font-size="11" fill="#888" letter-spacing="1">📦 CUSTOM BINARY</text>
    <text x="260" y="22" font-family="'Arial', sans-serif" font-size="11" fill="#888" letter-spacing="1">🖥️ VM INCLUDED</text>
  </g>
  
  <!-- BOTTOM SECTION -->
  <rect x="0" y="165" width="800" height="35" fill="rgba(255,255,255,0.02)"/>
  
  <!-- Bottom left -->
  <text x="40" y="187" 
        font-family="'Arial', sans-serif" 
        font-size="10" 
        fill="#333" 
        letter-spacing="1">
    BUILT BY A 13-YEAR-OLD ON 4GB RAM
  </text>
  
  <!-- Bottom center -->
  <text x="400" y="187" 
        font-family="'Arial', sans-serif" 
        font-size="10" 
        fill="#333" 
        text-anchor="middle" 
        letter-spacing="1">
    LANGUAGE FRAMEWORK
  </text>
  
  <!-- Bottom right -->
  <text x="760" y="187" 
        font-family="'Arial', sans-serif" 
        font-size="10" 
        fill="#333" 
        text-anchor="end" 
        letter-spacing="1">
    v1.0
  </text>
  
  <!-- Glow line bottom -->
  <line x1="50" y1="195" x2="750" y2="195" stroke="url(#bannerGrad)" stroke-width="1" opacity="0.15"/>
</svg>
